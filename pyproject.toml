[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epubconv"
version = "0.1.0"
description = "Arabic OCR to EPUB3 converter (PDF/images, deterministic, no hallucination)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<2.5",
    "opencv-python>=4.6",
    "pillow>=10.0",
    "pymupdf>=1.26",
    "ebooklib>=0.19",
    "paddleocr>=3.0,<3.8",
    "paddlepaddle>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
epubconv = "epubconv.cli:main"
epubconv-review = "epubconv.review_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end OCR tests (need paddleocr models + first-run download)"]
